name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Native visual regression checks
        id: native
        run: |
          sw_vers > target/ui-environment.txt
          uname -m >> target/ui-environment.txt
          system_profiler SPDisplaysDataType >> target/ui-environment.txt
          cargo test --test ui_rendering --locked
      - uses: actions/upload-artifact@v7
        if: failure() && steps.native.outcome == 'failure'
        with:
          name: native-visual-regressions
          path: |
            target/ui-artifacts/
            target/ui-environment.txt
            tests/visual/baseline/
            Cargo.lock
          retention-days: 14
