<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cadence OG card</title>
    <style>
      :root {
        --canvas: #fbfaf9;
        --text-primary: #171717;
        --text: #494440;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--canvas);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .intro {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding-top: 56px;
      }

      .mark {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.16));
      }

      .title {
        margin: 0;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .tagline {
        margin: 0;
        font-size: 24px;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .shot-frame {
        position: relative;
        width: 1120px;
        margin-top: 32px;
      }

      .shot {
        width: 1120px;
        height: auto;
        display: block;
      }

      .mascot {
        position: absolute;
        left: 78%;
        top: 4.06%;
        width: 92px;
        height: auto;
        transform: translateY(-100%);
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.16));
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="62" height="62" rx="16" fill="#171717" />
        <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none" stroke="#000" stroke-opacity=".16" />
        <circle cx="48" cy="16" r="5" fill="#b9ddf8" />
        <path d="M12 24a4 4 0 0 1 4 4v10a4 4 0 1 0 8 0V16a4 4 0 1 1 8 0v32a4 4 0 1 0 8 0V28a4 4 0 1 1 8 0v8a4 4 0 0 0 4 4" fill="none" stroke="#f7f5ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 class="title">Cadence</h1>
      <p class="tagline">A minimal Spotify player for macOS</p>
    </div>
    <div class="shot-frame">
      <img class="shot" src="../../assets/cadence.webp" alt="Cadence showing the Liked Songs library">
      <img class="mascot" src="../static/mascot.svg" alt="" width="16" height="16">
    </div>
  </body>
</html>
